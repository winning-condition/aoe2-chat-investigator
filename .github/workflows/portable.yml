name: Test and build portable GUI
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["gui/**"]
  pull_request:
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.22.0
      - run: python scripts/build_portable.py
      - run: python tests/portable_smoke.py
      - run: python scripts/source_bundle.py
      - run: python scripts/portable_archive.py
      - run: python tests/portable_smoke.py --archive
      - uses: actions/upload-artifact@v4
        with:
          name: AOE2-Chat-Investigator-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
